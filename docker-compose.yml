services:
  kafka-0:
    image: bitnamilegacy/kafka:3.4
    ports:
      - "9094:9094"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093
      - KAFKA_KRAFT_CLUSTER_ID=abcdefghijklmnopqrstuv
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-0:9092,EXTERNAL://127.0.0.1:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:SSL,EXTERNAL:SSL
      - KAFKA_SSL_KEYSTORE_FILENAME=kafka.kafka-0.keystore.pkcs12
      - KAFKA_SSL_KEYSTORE_CREDENTIALS=kafka-0_keystore_creds
      - KAFKA_SSL_KEY_CREDENTIALS=kafka-0_sslkey_creds
      - KAFKA_SSL_TRUSTSTORE_CREDENTIALS=kafka-0_truststore_creds
      - KAFKA_SSL_TRUSTSTORE_FILENAME=kafka.truststore.jks
      - KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM=https
      - KAFKA_CERTIFICATE_PASSWORD=your-password
      - KAFKA_CFG_AUTHORIZER_CLASS_NAME=org.apache.kafka.metadata.authorizer.StandardAuthorizer
      - KAFKA_CFG_ALLOW_EVERYONE_IF_NO_ACL_FOUND=false
      - KAFKA_CFG_SUPER_USERS=User:admin;User:kafka-0;User:kafka-1;User:kafka-2
      - KAFKA_CFG_SSL_CLIENT_AUTH=required
      - KAFKA_CFG_SSL_PRINCIPAL_MAPPING_RULES=RULE:^CN=(.*?),.*$/$1/,DEFAULT
    volumes:
      - kafka_0_data:/bitnami/kafka
      - ./kafka-0-creds:/bitnami/kafka/config/certs
    networks:
      - kafka-net

  kafka-1:
    image: bitnamilegacy/kafka:3.4
    ports:
      - "9095:9095"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093
      - KAFKA_KRAFT_CLUSTER_ID=abcdefghijklmnopqrstuv
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9095
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-1:9092,EXTERNAL://127.0.0.1:9095
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:SSL,EXTERNAL:SSL
      - KAFKA_SSL_KEYSTORE_LOCATION=/bitnami/kafka/config/certs/kafka.keystore.jks
      - KAFKA_SSL_KEYSTORE_TYPE=JKS
      - KAFKA_SSL_KEYSTORE_FILENAME=kafka.kafka-1.keystore.pkcs12
      - KAFKA_SSL_KEYSTORE_CREDENTIALS=kafka-1_keystore_creds
      - KAFKA_SSL_KEY_CREDENTIALS=kafka-1_sslkey_creds
      - KAFKA_SSL_TRUSTSTORE_LOCATION=/bitnami/kafka/config/certs/kafka.truststore.jks
      - KAFKA_SSL_TRUSTSTORE_TYPE=JKS
      - KAFKA_SSL_TRUSTSTORE_CREDENTIALS=kafka-1_truststore_creds
      - KAFKA_SSL_TRUSTSTORE_FILENAME=kafka.truststore.jks
      - KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM=https
      - KAFKA_CERTIFICATE_PASSWORD=your-password
      - KAFKA_CFG_AUTHORIZER_CLASS_NAME=org.apache.kafka.metadata.authorizer.StandardAuthorizer
      - KAFKA_CFG_ALLOW_EVERYONE_IF_NO_ACL_FOUND=false
      - KAFKA_CFG_SUPER_USERS=User:admin;User:kafka-0;User:kafka-1;User:kafka-2
      - KAFKA_CFG_SSL_CLIENT_AUTH=required
      - KAFKA_CFG_SSL_PRINCIPAL_MAPPING_RULES=RULE:^CN=(.*?),.*$/$1/,DEFAULT
    volumes:
      - kafka_1_data:/bitnami/kafka
      - ./kafka-1-creds:/bitnami/kafka/config/certs
    networks:
      - kafka-net

  kafka-2:
    image: bitnamilegacy/kafka:3.4
    ports:
      - "9096:9096"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_NODE_ID=2
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093
      - KAFKA_KRAFT_CLUSTER_ID=abcdefghijklmnopqrstuv
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9096
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-2:9092,EXTERNAL://127.0.0.1:9096
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:SSL,EXTERNAL:SSL
      - KAFKA_TLS_TYPE=JKS
      - KAFKA_SSL_KEYSTORE_LOCATION=/bitnami/kafka/config/certs/kafka.keystore.jks
      - KAFKA_SSL_KEYSTORE_FILENAME=kafka.kafka-2.keystore.pkcs12
      - KAFKA_SSL_KEYSTORE_CREDENTIALS=kafka-2_keystore_creds
      - KAFKA_SSL_KEY_CREDENTIALS=kafka-2_sslkey_creds
      - KAFKA_SSL_TRUSTSTORE_LOCATION=/bitnami/kafka/config/certs/kafka.truststore.jks
      - KAFKA_SSL_TRUSTSTORE_TYPE=JKS
      - KAFKA_SSL_TRUSTSTORE_CREDENTIALS=kafka-2_truststore_creds
      - KAFKA_SSL_TRUSTSTORE_FILENAME=kafka.truststore.jks
      - KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM=https
      - KAFKA_CERTIFICATE_PASSWORD=your-password
      - KAFKA_CFG_AUTHORIZER_CLASS_NAME=org.apache.kafka.metadata.authorizer.StandardAuthorizer
      - KAFKA_CFG_ALLOW_EVERYONE_IF_NO_ACL_FOUND=false
      - KAFKA_CFG_SUPER_USERS=User:admin;User:kafka-0;User:kafka-1;User:kafka-2
      - KAFKA_CFG_SSL_CLIENT_AUTH=required
      - KAFKA_CFG_SSL_PRINCIPAL_MAPPING_RULES=RULE:^CN=(.*?),.*$/$1/,DEFAULT
    volumes:
      - kafka_2_data:/bitnami/kafka
      - ./kafka-2-creds:/bitnami/kafka/config/certs
    networks:
      - kafka-net

  ui:
    image: provectuslabs/kafka-ui:v0.7.0
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS=kafka-0:9092,kafka-1:9092,kafka-2:9092
      - KAFKA_CLUSTERS_0_NAME=kraft-cluster
    depends_on:
      - kafka-0
      - kafka-1
      - kafka-2
    networks:
      - kafka-net

networks:
  kafka-net:
    driver: bridge

volumes:
  kafka_0_data:
  kafka_1_data:
  kafka_2_data: